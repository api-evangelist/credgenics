name: Credgenics
description: >-
  Credgenics is an AI-powered debt collection and loan recovery SaaS platform
  used by banks, NBFCs, housing-finance companies, microfinance institutions,
  fintechs and asset-reconstruction companies (primarily in India). Its REST
  Recovery API lets lenders push loan, customer, payment and transaction data
  into the platform and read collections status, DPD and penalties back,
  alongside digital communications, a GenAI voicebot (Swara), predictive
  dialing (DialNext), field collections (CG Collect), litigation management,
  online dispute resolution and the Billzy loan-repayment payments product.
  Authentication is a client-credentials exchange returning a short-lived
  `authenticationtoken`; every request carries the tenant `company_id`.
